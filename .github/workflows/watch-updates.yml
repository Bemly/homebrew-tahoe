name: Watch upstream versions

# 只允许手动点击运行（Actions → 本 workflow → Run workflow）。
# 不设 schedule / push 触发，把 GitHub Actions 用量压到最低。
#
# 只有批量模式：遍历 Formula/*.rb 与 Casks/*.rb，对每个存在同名 updater/<name>.swift
# 的软件检查上游版本（fastfetch.rb ↔ fastfetch.swift，一一对应）。
# - 公式（Formula/）：有更新则就地改写 url+sha256、摘除失效 bottle 块，提交后触发
#   bottle.yml 出 GHCR 瓶。
# - cask（Casks/）：有更新则下载发布包、上传本仓 GitHub Release、改写 cask 文件；
#   cask 无 bottle 机制（文档核实：bottle 是公式专属），故不触发 bottle.yml。
#
# 检查器是 Swift（runner 镜像自带工具链）：共享逻辑在 updater/UpdaterCore.swift，
# 每包一个入口文件；用 swiftc 编译后运行（解释器模式会静默跳过顶层代码，不能用）。
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 只检查不提交（就地改写公式但不 commit、不触发制瓶）
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: write   # 用 gh workflow run 触发 bottle.yml

# 同一时间只允许一个检查任务，避免重复消耗
concurrency:
  group: watch-updates
  cancel-in-progress: false

jobs:
  check:
    # 用 ubuntu-latest：macOS runner 的分钟数按 10 倍计费，这里完全不需要 macOS
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出仓库
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      # —— 批量扫描：swiftc 编译（核心 + 单包 @main 入口）后运行，收集更新与上游缺失 ——
      # 三道保护：dry_run=true 只扫不提交；提交前 ruby -c 语法自检；
      # 上游资源不可下载的软件收集进 missing 输出，由下一步逐个开告警 issue。
      - name: 批量扫描并更新
        id: batch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          updated=()
          updated_formulae=()
          missing=()
          for rb in Formula/*.rb Casks/*.rb; do
            f="$(basename "$rb" .rb)"
            dir="$(dirname "$rb")"
            if [[ ! -f "updater/$f.swift" ]]; then
              echo "::warning::$f 没有对应的 updater/$f.swift（新增软件须按 AGENTS.md 9.3 登记），跳过"
              continue
            fi
            out="$(mktemp)"
            # UpdaterCore.swift 是共享核心（无入口），<name>.swift 是唯一 @main 入口
            swiftc -O -o "/tmp/check-$f" "updater/UpdaterCore.swift" "updater/$f.swift"
            GITHUB_OUTPUT="$out" "/tmp/check-$f" || true
            status="$(grep '^status=' "$out" | cut -d= -f2 || true)"
            if [[ "$status" == "upstream-missing" ]]; then
              ver="$(grep '^new_version=' "$out" | cut -d= -f2 || true)"
              missing+=("${f}:${ver}")
              echo "  -> $f 上游资源不可下载（${ver}），跳过更新"
            elif [[ "$status" == "updated" ]]; then
              updated+=("$f")
              [[ "$dir" == "Formula" ]] && updated_formulae+=("$f")
              echo "  -> $f 需要更新"
            else
              echo "  -> $f 无需更新（${status:-无输出}）"
            fi
            rm -f "$out"
          done
          if [[ ${#updated[@]} -gt 0 ]]; then
            echo "updated=$(IFS=,; echo "${updated[*]}")" >> "$GITHUB_OUTPUT"
          fi
          # 只有公式才走 bottle；cask 无 bottle 机制
          if [[ ${#updated_formulae[@]} -gt 0 ]]; then
            echo "updated_formulae=$(IFS=,; echo "${updated_formulae[*]}")" >> "$GITHUB_OUTPUT"
          fi
          # 上游缺失清单交给后续步骤逐个开告警 issue
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "missing=$(IFS=,; echo "${missing[*]}")" >> "$GITHUB_OUTPUT"
          fi
          if [[ ${#updated[@]} -eq 0 ]]; then
            echo "没有软件需要更新。"
            exit 0
          fi
          list="$(IFS=,; echo "${updated[*]}")"
          echo "需要更新的软件：$list"
          # 批量更新直接提交 main，提交前先做语法自检
          for f in "${updated[@]}"; do
            # 公式与 cask 都可能被更新，按实际存在的文件自检
            if [[ -f "Formula/$f.rb" ]]; then ruby -c "Formula/$f.rb"; fi
            if [[ -f "Casks/$f.rb" ]]; then ruby -c "Casks/$f.rb"; fi
          done
          # dry_run=true：只检查不提交（不 commit、不触发制瓶）
          if [[ "${{ inputs.dry_run }}" == "true" ]]; then
            echo "dry_run=true：文件已就地改写但不提交、不触发制瓶。"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/*.rb Casks/*.rb
          git commit -m "watcher: batch bump ${list}"
          git push origin HEAD:main
          # 只有公式更新才触发制瓶；cask 无 bottle 机制，无需触发
          if [[ ${#updated_formulae[@]} -gt 0 ]]; then
            echo "已提交更新，触发单次批量制瓶（formula=${list}）"
            gh workflow run "Build bottle and publish to GHCR" \
              --repo bemly/homebrew-tahoe-intel \
              -f formula="$list"
          else
            echo "已提交更新（仅 cask，无需制瓶）"
          fi

      - name: 上游资源不可用时开 issue 告警
        if: steps.batch.outputs.missing != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MISSING: ${{ steps.batch.outputs.missing }}
        run: |
          set -euo pipefail
          gh label create "automated-alert" --color "d93f0b" \
            --description "自动告警" 2>/dev/null || true
          IFS=',' read -ra ITEMS <<< "$MISSING"
          for item in "${ITEMS[@]}"; do
            f="${item%%:*}"
            ver="${item##*:}"
            title="[告警] ${f} ${ver} 的上游资源不可下载"
            if gh issue list --state open --label "automated-alert" \
                 --json title --jq '.[].title' | grep -qxF "$title"; then
              echo "告警 issue 已存在，跳过：${title}"
              continue
            fi
            # heredoc 结束符必须顶格（脚本列 0），因此正文比 create 行少一层缩进
            gh issue create --title "$title" --label "automated-alert" --body "$(cat <<EOF
          \`watch-updates\` 发现 brew 上游已到 \`${ver}\`，但对应的上游预构建包无法下载。

          - 软件：\`${f}\`
          - 目标版本：\`${ver}\`
          - 瓶根地址：\`https://ghcr.io/v2/${{ github.repository_owner }}/tahoe-intel\`

          影响：公式无法升级，\`bottle.yml\` 也无法制瓶。
          请确认上游发布资产是否改名或被删除，或暂时保持当前版本。
          EOF
            )"
          done

      - name: 输出结论
        if: always()
        run: |
          {
            echo "## 上游版本批量扫描结果"
            echo ""
            echo "- 需要更新：\`${{ steps.batch.outputs.updated || '无' }}\`"
            echo "- 上游资源不可下载：\`${{ steps.batch.outputs.missing || '无' }}\`"
            echo "- dry_run：\`${{ inputs.dry_run }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
