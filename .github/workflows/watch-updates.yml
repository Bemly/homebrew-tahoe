name: Watch upstream versions

# 每天 UTC 04:00（北京时间 12:00）自动运行，也支持手动点击运行
# （Actions → 本 workflow → Run workflow）。不使用 push / pull_request 触发。
#
# 只有批量模式：遍历 Formula/*.rb 与 Casks/*.rb，对每个存在同名 updater/<name>.swift
# 的软件检查上游版本（fastfetch.rb ↔ fastfetch.swift，一一对应）。
# - 公式（Formula/）：有更新则就地改写 url+sha256、摘除失效 bottle 块，提交后触发
#   bottle.yml 出 GHCR 瓶。
# - cask（Casks/）：有更新则下载发布包、上传本仓 GitHub Release、改写 cask 文件；
#   cask 无 bottle 机制（文档核实：bottle 是公式专属），故不触发 bottle.yml。
#
# 检查器是 Swift（runner 镜像自带工具链）：共享逻辑在 updater/UpdaterCore.swift，
# 每包一个入口文件；用 swiftc 编译后运行（解释器模式会静默跳过顶层代码，不能用）。
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: 只检查不提交（就地改写公式但不 commit、不触发制瓶）
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: write   # 用 gh workflow run 触发 bottle.yml
  issues: write    # 告警步骤创建 label / issue 需要

# 同一时间只允许一个检查任务，避免重复消耗
concurrency:
  group: watch-updates
  cancel-in-progress: false

jobs:
  check:
    # 用 ubuntu-latest：macOS runner 的分钟数按 10 倍计费，这里完全不需要 macOS
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      # —— 批量扫描：默认 8 路并发编译/运行，独立日志/output，按队列顺序回放 ——
      # 三道保护：dry_run=true 只扫不提交；提交前 ruby -c 语法自检；
      # 上游资源不可下载的软件收集进 missing 输出，由下一步逐个开告警 issue。
      - name: 批量扫描并更新
        id: batch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          updated=()
          updated_formulae=()
          patched_packages=()
          waiting=()
          missing=()
          manual_sync=()
          failed=()
          TASK_RB=()
          for rb in Formula/*.rb Casks/*.rb; do
            TASK_RB+=("$rb")
          done
          JOBS="${WATCH_JOBS:-8}"
          run_one() {
            local idx="$1"
            local rb="$2"
            local f dir out log
            f="$(basename "$rb" .rb)"
            dir="$(dirname "$rb")"
            out="/tmp/watch-out-${idx}"
            log="/tmp/watch-log-${idx}"
            : > "$out"
            : > "$log"
            {
              if [[ ! -f "updater/$f.swift" ]]; then
                echo "::warning::$f 没有对应的 updater/$f.swift（新增软件须按 AGENTS.md §9 登记），跳过"
                return 0
              fi
              # UpdaterCore.swift 是共享核心（无入口），<name>.swift 是唯一 @main 入口
              if ! swiftc -O -o "/tmp/check-$f" "updater/UpdaterCore.swift" "updater/$f.swift"; then
                echo "::error::$f 检查器编译失败"
                return 0
              fi
              # 兜底超时：任何检查器（含上游页面抓取）卡死都不能挂住整个 watcher；
              # 超时等同无 status，走下面的 failed 兜底分支还原文件并公示。
              GITHUB_OUTPUT="$out" timeout 600 "/tmp/check-$f" || true
            } > "$log" 2>&1
            return 0
          }
          export -f run_one
          echo "并行检查 ${#TASK_RB[@]} 个软件，并发数 ${JOBS}"
          for idx in "${!TASK_RB[@]}"; do
            printf '%s\t%s\n' "$idx" "${TASK_RB[$idx]}"
          done | xargs -P "$JOBS" -n 2 bash -c 'run_one "$@"' _
          # 检查并行执行，日志按原队列顺序回放，避免交叉输出。
          for idx in "${!TASK_RB[@]}"; do
            rb="${TASK_RB[$idx]}"
            f="$(basename "$rb" .rb)"
            dir="$(dirname "$rb")"
            out="/tmp/watch-out-${idx}"
            log="/tmp/watch-log-${idx}"
            cat "$log" 2>/dev/null || true
            if [[ ! -f "updater/$f.swift" ]]; then
              rm -f "$out" "$log"
              continue
            fi
            status="$(grep '^status=' "$out" | cut -d= -f2 || true)"
            # —— 静默失败兜底：检查器没有回 status 行（自检 fail 直接 exit 1、
            # 编译后崩溃、GITHUB_OUTPUT 没写上），绝不能当"无需更新"吃掉——
            # graphviz 残 URL 就是这么静默进 main 的（2026-09-16：status 空，
            # 落进 else 分支打了句"无需更新"就提交了坏文件）。
            # 无 status 即视为检查失败：不提交该文件（git checkout 还原），
            # 记入 failed 清单公示，下次跑自动恢复。
            if [[ -z "$status" ]]; then
              git checkout -- "$rb" 2>/dev/null || true
              failed+=("$f")
              echo "::warning::$f 无状态输出（自检 fail 或崩溃），已还原文件并跳过（绝不当成无需更新）"
            elif [[ "$status" == "needs-patched-build" ]]; then
              ver="$(grep '^new_version=' "$out" | cut -d= -f2 || true)"
              patched_packages+=("$f")
              echo "  -> $f 上游已就绪（${ver}），待触发 patched.yml 构建发布"
            elif [[ "$status" == "waiting-upstream" ]]; then
              ver="$(grep '^new_version=' "$out" | cut -d= -f2 || true)"
              waiting+=("${f}:${ver}")
              echo "  -> $f 等待上游适配（${ver}），暂缓触发构建"
            elif [[ "$status" == "upstream-missing" ]]; then
              ver="$(grep '^new_version=' "$out" | cut -d= -f2 || true)"
              missing+=("${f}:${ver}")
              echo "  -> $f 上游资源不可下载（${ver}），跳过更新"
            elif [[ "$status" == "manual-sync" ]]; then
              ver="$(grep '^new_version=' "$out" | cut -d= -f2 || true)"
              manual_sync+=("${f}:${ver}")
              echo "  -> $f 需人工同步上游变更（${ver}），跳过自动改写"
            elif [[ "$status" == "check-failed" ]]; then
              failed+=("$f")
              echo "::warning::$f 检查失败（限流或网络故障），跳过（绝不当成无需更新）"
            elif [[ "$status" == "updated" ]]; then
              updated+=("$f")
              [[ "$dir" == "Formula" ]] && updated_formulae+=("$f")
              echo "  -> $f 需要更新"
            else
              echo "  -> $f 无需更新（${status:-无输出}）"
            fi
            rm -f "$out" "$log"
          done
          # 先落盘 outputs：updated/missing 已定；failed 后面 fetch 段还会追加，
          # 那里直接 append 到 GITHUB_OUTPUT（early-exit 分支也要能公示）。
          if [[ ${#updated[@]} -gt 0 ]]; then
            echo "updated=$(IFS=,; echo "${updated[*]}")" >> "$GITHUB_OUTPUT"
          fi
          # 只有公式才走 bottle；cask 无 bottle 机制
          if [[ ${#updated_formulae[@]} -gt 0 ]]; then
            echo "updated_formulae=$(IFS=,; echo "${updated_formulae[*]}")" >> "$GITHUB_OUTPUT"
          fi
          # 上游缺失、需人工同步、补丁成品触发与等待适配清单落盘到 GITHUB_OUTPUT
          if [[ ${#patched_packages[@]} -gt 0 ]]; then
            echo "patched=$(IFS=,; echo "${patched_packages[*]}")" >> "$GITHUB_OUTPUT"
          fi
          if [[ ${#waiting[@]} -gt 0 ]]; then
            echo "waiting=$(IFS=,; echo "${waiting[*]}")" >> "$GITHUB_OUTPUT"
          fi
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "missing=$(IFS=,; echo "${missing[*]}")" >> "$GITHUB_OUTPUT"
          fi
          if [[ ${#manual_sync[@]} -gt 0 ]]; then
            echo "manual_sync=$(IFS=,; echo "${manual_sync[*]}")" >> "$GITHUB_OUTPUT"
          fi
          if [[ ${#updated[@]} -eq 0 ]]; then
            echo "没有软件需要更新。"
            # 检查失败清单只公示（下次跑自动恢复，不开 issue）
            if [[ ${#failed[@]} -gt 0 ]]; then
              echo "failed=$(IFS=,; echo "${failed[*]}")" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi
          list="$(IFS=,; echo "${updated[*]}")"
          echo "需要更新的软件：$list"
          # 批量更新直接提交 main，提交前先做语法自检 +
          # 端到端 fetch 验证（url+sha 真可下载且一致）。
          # 语法对不代表资源对：graphviz 残 URL（path 新、文件名旧 → 404）就是
          # ruby -c 全绿、提交后才在制瓶 fetch 现形的（2026-09-16）。
          # fetch 在 ubuntu 上只验直链（瓶块已摘，无 GHCR 可走），失败即还原该文件、
          # 记入 failed，不阻断其它包。
          for f in "${updated[@]}"; do
            # 公式与 cask 都可能被更新，按实际存在的文件自检
            if [[ -f "Formula/$f.rb" ]]; then ruby -c "Formula/$f.rb"; fi
            if [[ -f "Casks/$f.rb" ]]; then ruby -c "Casks/$f.rb"; fi
          done
          fetch_failed=()
          # ubuntu runner 的 linuxbrew 默认不在 PATH：先显式接入
          # （缺这步就是本次的 `brew: command not found`，全部 fetch 失败被还原）。
          if ! command -v brew >/dev/null 2>&1 && [[ -x "/home/linuxbrew/.linuxbrew/bin/brew" ]]; then
            eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          fi
          if ! command -v brew >/dev/null 2>&1; then
            echo "::error::找不到 brew（linuxbrew 不在 PATH），fetch 验证无法执行，已还原全部更新并跳过提交"
            for f in "${updated[@]}"; do
              if [[ -f "Formula/$f.rb" ]]; then git checkout -- "Formula/$f.rb" 2>/dev/null || true; fi
              if [[ -f "Casks/$f.rb" ]]; then git checkout -- "Casks/$f.rb" 2>/dev/null || true; fi
              failed+=("$f(brew-missing)")
            done
            echo "failed=$(IFS=,; echo "${failed[*]}")" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # 直接将 $GITHUB_WORKSPACE 软链进 Taps 目录（brew tap 默认 clone 只读到旧 HEAD，
          # 读不到本步骤刚刚就地改写好的公式）。
          taps_dir="$(brew --repository)/Library/Taps/bemly"
          mkdir -p "$taps_dir"
          ln -sfn "$GITHUB_WORKSPACE" "$taps_dir/homebrew-tahoe"
          brew trust bemly/tahoe
          for f in "${updated_formulae[@]}"; do
            # linuxbrew：tap 本仓后 fetch 只验直链（瓶块已摘、无 GHCR 可走），
            # 正好覆盖 url+sha。无同名 tap 冲突（ubuntu runner 干净），失败只可能是资源问题。
            if ! brew fetch --force "bemly/tahoe/$f" 2>&1 | tail -n 3; then
              echo "::warning::$f fetch 验证失败（url 或 sha 不可用），还原并跳过提交"
              git checkout -- "Formula/$f.rb" 2>/dev/null || true
              fetch_failed+=("$f")
              failed+=("$f(fetch)")
            fi
          done
          if [[ ${#fetch_failed[@]} -gt 0 ]]; then
            # 用 pattern 文件逐个剔除：`grep -vxF "${arr[@]}"` 多元素时首个当 pattern、
            # 其余被当文件名（本次 `grep: ffmpeg: No such file` 即此），必须走 -f 文件。
            # 注意：grep 全剔除时 exit 1（空输出），|| true 保住（set -e 下不炸）。
            # failed（含 fetch 追加）直接 append 到 GITHUB_OUTPUT——前面的 failed 输出
            # 是在 updated 非空分支落的盘，这里追加不覆盖。
            _pat="$(mktemp)"
            printf '%s\n' "${fetch_failed[@]}" > "$_pat"
            updated=($(printf '%s\n' "${updated[@]}" | grep -vxFf "$_pat" || true))
            updated_formulae=($(printf '%s\n' "${updated_formulae[@]}" | grep -vxFf "$_pat" || true))
            rm -f "$_pat"
            echo "fetch 失败已剔除：$(IFS=,; echo "${fetch_failed[*]}")"
            echo "剔除后待提交：$(IFS=,; echo "${updated[*]:-无}")"
          fi
          # 检查失败清单只公示（下次跑自动恢复，不开 issue）
          if [[ ${#failed[@]} -gt 0 ]]; then
            echo "failed=$(IFS=,; echo "${failed[*]}")" >> "$GITHUB_OUTPUT"
          fi
          if [[ ${#updated[@]} -eq 0 ]]; then
            echo "全部更新均未通过 fetch 验证，无可提交内容。"
            exit 0
          fi
          if [[ "${{ inputs.dry_run }}" == "true" ]]; then
            echo "dry_run=true：文件已就地改写但不提交、不触发制瓶。"
            exit 0
          fi
          # 公式与 cask 分离发布：cask 资产已镜像，可直接提交 main；公式先暂存到
          # 临时分支，等 bottle.yml 逐个制瓶成功后才会把新版本+瓶块提交 main。
          updated_casks=()
          for f in "${updated[@]}"; do
            [[ -f "Casks/$f.rb" ]] && updated_casks+=("$f")
          done
          formula_list="$(IFS=,; echo "${updated_formulae[*]}")"
          cask_list="$(IFS=,; echo "${updated_casks[*]}")"
          formula_patch="$(mktemp)"
          if [[ ${#updated_formulae[@]} -gt 0 ]]; then
            git diff --binary -- Formula > "$formula_patch"
            git checkout -- Formula
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ ${#updated_casks[@]} -gt 0 ]]; then
            git add Casks/*.rb
            git commit -m "watcher: batch bump ${cask_list}"
            if ! git push origin HEAD:main; then
              git pull --rebase origin main
              git push origin HEAD:main
            fi
            echo "已提交 cask 更新：${cask_list}"
          fi
          if [[ ${#updated_formulae[@]} -gt 0 ]]; then
            branch="watcher/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            git fetch origin main
            git switch -c "$branch" origin/main
            git apply "$formula_patch"
            git add Formula/*.rb
            git commit -m "watcher: stage ${formula_list}"
            git push -u origin "$branch"
            echo "公式已暂存到 ${branch}，触发单次批量制瓶（formula=${formula_list}）"
            gh workflow run "Build bottle and publish to GHCR" \
              --repo bemly/homebrew-tahoe \
              --ref "$branch" \
              -f formula="$formula_list" \
              -f source_ref="$branch"
          else
            echo "已提交更新（仅 cask，无需制瓶）"
          fi
          rm -f "$formula_patch"

      - name: 触发补丁成品构建（patched.yml）
        if: (!inputs.dry_run) && steps.batch.outputs.patched != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PATCHED: ${{ steps.batch.outputs.patched }}
        run: |
          set -euo pipefail
          IFS=',' read -ra PKGS <<< "$PATCHED"
          for pkg in "${PKGS[@]}"; do
            [[ -n "$pkg" ]] || continue
            echo "触发 patched.yml 构建发布：package=${pkg} revision=1"
            gh workflow run "Build patched cask artifacts" \
              --repo bemly/homebrew-tahoe \
              -f package="$pkg" \
              -f revision=1
          done

      - name: 上游资源不可用或需人工同步时开 issue 告警
        if: steps.batch.outputs.missing != '' || steps.batch.outputs.manual_sync != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MISSING: ${{ steps.batch.outputs.missing }}
          MANUAL_SYNC: ${{ steps.batch.outputs.manual_sync }}
        run: |
          set -euo pipefail
          gh label create "automated-alert" --force --color "d93f0b" \
            --description "自动告警" \
            || { echo "::error::automated-alert label 创建失败（检查 issues 权限），本次放弃告警"; exit 1; }
          if [[ -n "${MISSING:-}" ]]; then
            IFS=',' read -ra ITEMS <<< "$MISSING"
            for item in "${ITEMS[@]}"; do
              f="${item%%:*}"
              ver="${item##*:}"
              title="[告警] ${f} ${ver} 的上游资源不可下载"
              if gh issue list --state open --label "automated-alert" \
                   --json title --jq '.[].title' | grep -qxF "$title"; then
                echo "告警 issue 已存在，跳过：${title}"
                continue
              fi
              # heredoc 结束符必须顶格（脚本列 0），因此正文比 create 行少一层缩进
              gh issue create --title "$title" --label "automated-alert" --body "$(cat <<EOF
          \`watch-updates\` 发现 brew 上游已到 \`${ver}\`，但对应的上游预构建包无法下载。

          - 软件：\`${f}\`
          - 目标版本：\`${ver}\`
          - 瓶根地址：\`https://ghcr.io/v2/${{ github.repository_owner }}/tahoe\`

          影响：公式无法升级，\`bottle.yml\` 也无法制瓶。
          请确认上游发布资产是否改名或被删除，或暂时保持当前版本。
          EOF
              )"
            done
          fi
          if [[ -n "${MANUAL_SYNC:-}" ]]; then
            IFS=',' read -ra SYNC_ITEMS <<< "$MANUAL_SYNC"
            for item in "${SYNC_ITEMS[@]}"; do
              f="${item%%:*}"
              ver="${item##*:}"
              title="[需人工同步] ${f} ${ver}"
              if gh issue list --state open --label "automated-alert" \
                   --json title --jq '.[].title' | grep -qxF "$title"; then
                echo "告警 issue 已存在，跳过：${title}"
                continue
              fi
              gh issue create --title "$title" --label "automated-alert" --body "$(cat <<EOF
          \`watch-updates\` 发现 \`homebrew/core\` 中 \`${f}\` 已更新至 \`${ver}\`。

          - 软件：\`${f}\`
          - 上游版本：\`${ver}\`

          该公式包含与主版本强耦合的 \`resource\` 或 \`patch_checksum_pairs\`，watcher 已故意跳过自动改写。
          请对照 \`homebrew/core\` 人工同步 \`Formula/${f}.rb\` 的资源块、补丁列表与版本号后再触发 \`bottle.yml\` 制瓶。
          EOF
              )"
            done
          fi

      - name: 输出结论
        if: always()
        run: |
          {
            echo "## 上游版本批量扫描结果"
            echo ""
            echo "- 需要更新：\`${{ steps.batch.outputs.updated || '无' }}\`"
            echo "- 触发补丁成品构建：\`${{ steps.batch.outputs.patched || '无' }}\`"
            echo "- 等待上游适配：\`${{ steps.batch.outputs.waiting || '无' }}\`"
            echo "- 上游资源不可下载：\`${{ steps.batch.outputs.missing || '无' }}\`"
            echo "- 需人工同步：\`${{ steps.batch.outputs.manual_sync || '无' }}\`"
            echo "- 检查失败（下次自动恢复）：\`${{ steps.batch.outputs.failed || '无' }}\`"
            echo "- dry_run：\`${{ inputs.dry_run }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
