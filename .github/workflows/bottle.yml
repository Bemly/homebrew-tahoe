name: Build bottle and publish to GHCR

# 把上游预构建包（不重新编译）打包成 Homebrew 瓶，推送到 GHCR 覆盖旧瓶。
#
# 仅手动触发。构建环境必须是 Intel + macOS 26 才能产出 x86_64_tahoe 标签的瓶，
# GitHub 托管 runner 对应的 label 是 macos-26-intel。
#
# formula 入参支持三种写法（见 AGENTS.md §5 / §8）：
#   - 单个：  gh
#   - 多个：  gh,fastfetch   （逗号分隔，只针对这批软件出瓶，最省 runner）
#   - 全部：  all            （遍历 Formula/*.rb）
# 无论几个软件，都只在「一次」macos-26-intel 任务里顺序完成，避免多次占用 runner。
on:
  workflow_dispatch:
    inputs:
      formula:
        description: 要制瓶的软件（单个名 / 逗号分隔多个 / all 表示全部）
        required: true
        default: gh
        type: string
      allow_unbottled_core:
        description: 临时豁免递归依赖门控——允许 core 依赖在 Intel Tahoe 无瓶（会在用户端源码编译）
        required: false
        default: false
        type: boolean
      watcher_run_id:
        description: watcher 运行 ID；用于下载公式候选补丁 artifact，留空表示直接制当前 main
        required: false
        default: ""
        type: string

permissions:
  actions: read
  contents: write
  packages: write

# 并发组不按入参分组：不同入参的两次制瓶若并行，会同时 git push main、
# 删/推 GHCR 标签而互相冲突。全局 group 让所有制瓶任务排队串行执行。
concurrency:
  group: bottle
  cancel-in-progress: false

env:
  # GitHubPackages.root_url 会剥掉仓库名的 homebrew- 前缀：
  #   bemly/homebrew-tahoe -> https://ghcr.io/v2/bemly/tahoe
  ROOT_URL: https://ghcr.io/v2/${{ github.repository_owner }}/tahoe
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1
  HOMEBREW_NO_ENV_HINTS: 1

jobs:
  bottle:
    runs-on: macos-26-intel
    # qemu 是代编译模式：runner 是干净环境，core 侧依赖（glib/gnutls/openssl@3…
    # 无 x86_64_tahoe 瓶）要现编 1–2.5 小时，qemu 自身全量 68 目标再 2–3 小时。
    # 取平台上限 360 分钟（GitHub 单 job 硬上限 6 小时）。
    # 注：本仓是 public 仓库，标准 runner（含 macOS）不消耗付费额度。

    steps:
      - name: 检出仓库
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          ref: main

      - name: 应用 watcher 公式候选补丁
        if: inputs.watcher_run_id != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WATCHER_RUN_ID: ${{ inputs.watcher_run_id }}
        run: |
          set -euo pipefail
          dest="$RUNNER_TEMP/formula-updates"
          mkdir -p "$dest"
          gh run download "$WATCHER_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            -n formula-updates -D "$dest"
          git apply "$dest/formula-updates.patch"

      - name: 计算待制瓶软件列表
        run: |
          set -euo pipefail
          # macos runner 的 /bin/bash 是 3.2，没有 mapfile，用 while-read 兼容写法
          if [[ "${{ inputs.formula }}" == "all" ]]; then
            FORMULAS=()
            while IFS= read -r line; do
              [[ -n "$line" ]] && FORMULAS+=("$line")
            done < <(ls Formula/*.rb | xargs -n1 basename | sed 's/\.rb$//')
          else
            IFS=',' read -ra FORMULAS <<< "${{ inputs.formula }}"
          fi
          # 去空、去重、排序，落到 /tmp/formulas.txt 供后续步骤复用
          printf '%s\n' "${FORMULAS[@]}" | sed '/^$/d' | sort -u > /tmp/formulas.txt
          echo "本次制瓶软件：$(paste -sd, /tmp/formulas.txt)"

      - name: 安装 skopeo 并更新 Homebrew
        run: |
          set -euo pipefail
          # skopeo 安装须先利用 runner 镜像自带 API 缓存中的 sonoma 瓶（最新 core 1.25.2 已撤回 x86_64 瓶）
          brew install skopeo
          # 安装完 skopeo 后再清理过期 API 缓存与 core checkout，并更新 Homebrew 本体：
          # 最新 core 公式已引入 manifest_sha256 等新 DSL，若只清 API 缓存不更新 brew，
          # 解析 core 构建依赖（xz/bison/pkgconf 等）时会报 undefined method 'manifest_sha256'。
          # 放在软链 bemly/tahoe 之前执行，确保 brew update 不会触碰工作区。
          rm -rf "$(brew --cache)/api" "$(brew --repository)/Library/Taps/homebrew/homebrew-core"
          brew update

      # brew tap 默认是 clone，改动会落在克隆副本上导致提交丢失。
      # 用软链接指回工作区，brew bottle --merge --write 才能改到待提交的文件。
      - name: 把本仓软链进 Taps 目录
        run: |
          set -euo pipefail
          taps_dir="$(brew --repository)/Library/Taps/${{ github.repository_owner }}"
          mkdir -p "$taps_dir"
          ln -sfn "$GITHUB_WORKSPACE" "$taps_dir/homebrew-tahoe"
          brew tap-info bemly/tahoe

      # 新版本 Homebrew 要求显式信任 tap，否则会忽略公式、制瓶拿不到公式。
      # 软链进来的 tap 默认不受信任，这里整体信任本 tap。
      - name: 信任本 tap
        run: brew trust bemly/tahoe

      # 秒级体检：开编之前先把 tap 内所有公式过一遍 brew readall。
      # 代编译模式一次构建可达数小时，公式若有语法/引用/门禁问题，
      # 必须在这里就红掉，而不是编译几小时后才发现（见 AGENTS.md §8）。
      - name: 公式体检（防白跑）
        run: brew readall bemly/tahoe

      # GHCR 瓶只含本体；依赖必须一并入本源、写全名引用，否则 core 依赖会在用户端
      # 现场源码编译（见 AGENTS.md §5 / §11.2）。这里递归展开每批
      # 公式的构建+运行时依赖闭包，开编前就红掉，而不是等用户装瓶时才发现要编译几十分钟。
      - name: 递归检查依赖瓶覆盖
        env:
          ALLOW_UNBOTTLED_CORE: ${{ inputs.allow_unbottled_core }}
        run: |
          set -euo pipefail
          FORMULAS=()
          while IFS= read -r line; do
            [[ -n "$line" ]] && FORMULAS+=("$line")
          done < /tmp/formulas.txt
          tap_missing="/tmp/tap_deps_missing.txt"
          core_unbottled="/tmp/core_deps_unbottled.txt"
          : > "$tap_missing"
          : > "$core_unbottled"
          mkdir -p /tmp/core-bottle-cache
          core_has_bottle() {
            local dep="$1" cache_key="${1//\//_}"
            if [[ -f "/tmp/core-bottle-cache/${cache_key}.ok" ]]; then
              return 0
            fi
            if [[ -f "/tmp/core-bottle-cache/${cache_key}.missing" ]]; then
              return 1
            fi
            # brew info --json=v2 对未安装的 core 公式不返回 bottle 元数据；
            # 统一走 formulae.brew.sh（与 watcher 同源），只认 Intel Tahoe 瓶标签。
            if curl -fsSL --max-time 20 "https://formulae.brew.sh/api/formula/${dep}.json" 2>/dev/null \
              | grep -Eq '"(all|x86_64_tahoe|tahoe)"[[:space:]]*:'; then
              touch "/tmp/core-bottle-cache/${cache_key}.ok"
              return 0
            fi
            touch "/tmp/core-bottle-cache/${cache_key}.missing"
            return 1
          }
          for f in "${FORMULAS[@]}"; do
            queue="bemly/tahoe/$f"
            visited=""
            while [[ -n "$queue" ]]; do
              dep="${queue%% *}"
              if [[ "$queue" == *" "* ]]; then queue="${queue#* }"; else queue=""; fi
              case " $visited " in
                *" $dep "*) continue ;;
              esac
              visited="$visited $dep"
              expand_build=false
              if [[ "$dep" == "bemly/tahoe/$f" ]]; then
                expand_build=true
              else
                case "$dep" in
                  bemly/tahoe/*)
                    short="${dep#bemly/tahoe/}"
                    # 同批公式由拓扑排序在本轮出瓶，且会作为独立目标展开自己的闭包。
                    case " ${FORMULAS[*]} " in
                      *" $short "*) continue ;;
                    esac
                    if [[ ! -f "Formula/${short}.rb" ]]; then
                      echo "$f -> $dep (Formula 不存在)" >> "$tap_missing"
                      continue
                    fi
                    if ! grep -Eq '^[[:space:]]*sha256[^#]*tahoe:' "Formula/${short}.rb"; then
                      echo "$f -> $dep (公式无 tahoe 瓶块)" >> "$tap_missing"
                      continue
                    fi
                    ;;
                  *)
                    # std_cmake_args/system "cmake" 会让 brew deps 额外报告裸 cmake；
                    # 下方预装分支已把实际构建工具换成本 tap cmake，这里不再误报 Core 缺瓶。
                    if [[ "$dep" == "cmake" ]] \
                      && grep -q 'system "cmake"' "Formula/${f}.rb" \
                      && ! grep -Eq 'depends_on "([^"]*/)?cmake"' "Formula/${f}.rb"; then
                      continue
                    fi
                    if ! core_has_bottle "$dep"; then
                      echo "$f -> $dep" >> "$core_unbottled"
                      continue
                    fi
                    ;;
                esac
              fi
              # 目标本体与本批待构建公式需要完整构建闭包；已瓶化依赖只检查运行时闭包，
              # 否则会把 vulkan-headers(all) 的构建依赖 cmake 误当成用户端缺失瓶。
              deps_args=(--full-name)
              $expand_build && deps_args=(--include-build --full-name)
              for child in $(brew deps "${deps_args[@]}" "$dep" 2>/dev/null); do
                [[ "$child" == "$dep" ]] || queue="$queue $child"
              done
            done
          done
          sort -u "$tap_missing" -o "$tap_missing"
          sort -u "$core_unbottled" -o "$core_unbottled"
          if [[ -s "$tap_missing" ]]; then
            echo "::error::本仓依赖缺瓶：必须先把依赖入源并出瓶，再在公式里写全名引用"
            cat "$tap_missing"
            exit 1
          fi
          if [[ -s "$core_unbottled" ]]; then
            echo "::error::core 依赖在 Intel Tahoe 无瓶，用户端会现场源码编译（应把依赖入本源并改全名引用）"
            cat "$core_unbottled"
            if [[ "${ALLOW_UNBOTTLED_CORE}" != "true" ]]; then
              exit 1
            fi
            echo "::warning::allow_unbottled_core=true，已放行上述 core 依赖"
          fi
          echo "递归依赖检查通过：${#FORMULAS[@]} 个公式"

      # 一次任务内顺序处理所有软件：build-bottle 安装 → 制瓶 → 删旧标签 → 推 GHCR。
      # 只占用「一个」macos-26-intel runner，避免每个软件各占一次（见 AGENTS.md §5）。
      # 每个公式推瓶成功后立即单独提交「候选版本 + 瓶块」到 main；后续包失败或
      # job 被取消时，已完成包仍保持可用，main 不会提前暴露尚未出瓶的新版本。
      - name: 循环制瓶并推 GHCR
        id: bottle_loop
        env:
          # gh CLI 读的是 GH_TOKEN / GITHUB_TOKEN 环境变量；Actions 不会自动把
          # secrets.GITHUB_TOKEN 注入环境，不显式传则 gh 完全无凭据，
          # 调 API 时直接报认证错误、stdout 为空（清理会静默失效）。
          # 本机之所以测不出来，是因为 gh 会回落到 keyring 里的个人 token。
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_GITHUB_PACKAGES_USER: ${{ github.repository_owner }}
          HOMEBREW_GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # macos runner 的 /bin/bash 是 3.2：没有 mapfile、没有 ${var,,}，都用兼容写法
          # root_url 归一小写（仓库改名后 owner 可能带大写，与公式里的小写保持一致）
          ROOT_URL="$(printf '%s' "$ROOT_URL" | tr '[:upper:]' '[:lower:]')"
          FORMULAS=()
          while IFS= read -r line; do
            [[ -n "$line" ]] && FORMULAS+=("$line")
          done < /tmp/formulas.txt
          BREW_PREFIX="$(brew --prefix)"
          # runner 预装的 core curl 动态依赖 libnghttp3/libidn2/libssh2 等；重建这些库时
          # 先卸载旧 keg 会让 curl 立即 dyld 失败，导致后续源码/瓶下载全部中断。
          # 制瓶环境改用 macOS 系统 curl，避免下载器被本轮重建的基础设施拖垮。
          brew uninstall --force --ignore-dependencies curl >/dev/null 2>&1 || true
          rm -f "${BREW_PREFIX}/bin/curl"
          hash -r
          # —— 依赖拓扑排序：被依赖者先制瓶 ——
          # 有些公式依赖本 tap 的其它公式（如 deepseek-harness/cmd → node、
          # opencode → ripgrep、qemu → capstone/dtc/libslirp/vde、curl3 → libnghttp3/libngtcp2）。
          # 依赖必须先出瓶，否则被依赖者装不上时（无瓶走源码编译，在 CI 里直接失败），
          # 依赖它的公式连 install 都进不去。
          # 做法：读每个公式的 depends_on "bemly/tahoe/X"，多轮扫描——每轮排出
          # 所有"本批内依赖已排空"的公式；一轮无进展则把剩余按原序全收（防环兜底）。
          # 纯 bash（macos runner 是 bash 3.2，无关联数组；python 方案因 YAML
          # 缩进问题解析失败，已废弃）。本批之外的依赖视为已满足（外部瓶或历史瓶）。
          # 注意字母序陷阱：opencode < ripgrep，deepseek-harness < node——排序绝不能省。
          remaining=" ${FORMULAS[*]} "
          sorted=""
          for _ in "${FORMULAS[@]}"; do
            [[ -z "${remaining// /}" ]] && break
            progressed=false
            for f in "${FORMULAS[@]}"; do
              case "$remaining" in
                *" $f "*) ;;
                *) continue ;;
              esac
              deps="$(sed -n 's/^[[:space:]]*depends_on "bemly\/tahoe\/\([^"]*\)".*/\1/p' "Formula/${f}.rb" 2>/dev/null)"
              ready=true
              for d in $deps; do
                case "$remaining" in
                  *" $d "*) ready=false; break ;;
                esac
              done
              if $ready; then
                sorted="$sorted $f"
                remaining="${remaining/ $f / }"
                progressed=true
              fi
            done
            if ! $progressed; then
              for f in "${FORMULAS[@]}"; do
                case "$remaining" in
                  *" $f "*) sorted="$sorted $f" ;;
                esac
              done
              break
            fi
          done
          FORMULAS_SORTED=($sorted)
          # 结果必须与输入同一集合，否则回退原序（宁可慢，不可错）
          if [[ "${#FORMULAS_SORTED[@]}" != "${#FORMULAS[@]}" ]]; then
            FORMULAS_SORTED=("${FORMULAS[@]}")
          fi
          echo "制瓶顺序（依赖优先）：$(printf '%s,' "${FORMULAS_SORTED[@]}")"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          MAIN_WT="${RUNNER_TEMP}/tahoe-main"
          git worktree add --detach "$MAIN_WT" origin/main
          : > /tmp/committed.txt
          commit_formula() {
            local f="$1"
            local version="$2"
            local patch="${RUNNER_TEMP}/${f//\//_}.patch"
            git fetch origin main
            git diff --binary origin/main -- "Formula/${f}.rb" > "$patch"
            if [[ ! -s "$patch" ]]; then
              echo "::error::${f} 相对 main 无改动，跳过提交"
              return 1
            fi
            git -C "$MAIN_WT" fetch origin main
            git -C "$MAIN_WT" merge --ff-only origin/main
            if ! git -C "$MAIN_WT" apply "$patch"; then
              echo "::error::${f} 暂存补丁与最新 main 冲突，保持 main 旧版不变"
              return 1
            fi
            "$(brew --repository)/Library/Homebrew/vendor/portable-ruby/current/bin/ruby" -c "$MAIN_WT/Formula/${f}.rb"
            git -C "$MAIN_WT" add "Formula/${f}.rb"
            git -C "$MAIN_WT" commit -m "bottle: ${f} ${version}"
            if ! git -C "$MAIN_WT" push origin HEAD:main; then
              git -C "$MAIN_WT" fetch origin main
              git -C "$MAIN_WT" rebase origin/main
              git -C "$MAIN_WT" push origin HEAD:main
            fi
            echo "$f" >> /tmp/committed.txt
            echo "已单独提交 ${f} ${version} 的新版本与瓶块"
          }
          for f in "${FORMULAS_SORTED[@]}"; do
            echo "===== 处理 $f ====="
            # node 家族（node / node@24 / node@22）共用 bin/node、bin/npm 等链接。
            # runner 镜像预装了 core 的 node@24（实测 24.19.0），它的链接会直接阻塞
            # 本 tap 公式的 link 步骤：
            #   "Target /usr/local/bin/node is a symlink belonging to node@24"
            # brew unlink 对预装但登记不全的 keg 会静默失败（链接仍在），
            # 所以再兜底直接删掉冲突符号链接——CI 是一次性环境，安全。
            for variant in node node@24 node@22 node@20; do
              brew uninstall --force --ignore-dependencies "$variant" >/dev/null 2>&1 || true
            done
            for b in node npm npx corepack; do
              rm -f "${BREW_PREFIX}/bin/${b}"
            done
            rm -f "${BREW_PREFIX}/share/man/man1/node.1"

            # macOS 自带/官网 Python 在 /usr/local/bin 留下的链接会阻塞
            # 本 tap python@3.11 / python@3.14 / python@3.15（作为本体或依赖安装时）的 link 步骤（runner 一次性环境）。
            for b in 2to3-3.11 idle3.11 pydoc3.11 python3.11 python3.11-config \
                     2to3-3.14 idle3.14 pydoc3.14 python3.14 python3.14-config pip3.14 wheel3.14 \
                     2to3-3.15 idle3.15 pydoc3.15 python3.15 python3.15-config pip3.15 wheel3.15; do
              rm -f "${BREW_PREFIX}/bin/${b}"
            done
            # 清理 runner 预装的旧版 headers，避免命中旧版 vulkan-headers / spirv-headers
            brew uninstall --force --ignore-dependencies vulkan-headers spirv-headers >/dev/null 2>&1 || true

            # 传递依赖闭包里的全名同名 keg 冲突清理：
            # macos-26-intel 镜像预装了部分 core keg（如 python@3.14 / gnutls / glib / ncurses 等），
            # 沿 `brew deps --include-build --full-name` 扫描所有本仓 `bemly/tahoe/*` 传递依赖，
            # 若本地已装 keg 不是来自 `bemly/tahoe`，先强卸再交给 install 倒回本源 GHCR 瓶；
            # 裸名 core 依赖不在其中，避免误卸预装构建工具。
            for dep in $(HOMEBREW_NO_ENV_HINTS=1 brew deps --include-build --full-name "bemly/tahoe/$f" 2>/dev/null | sed -n 's|^bemly/tahoe/||p'); do
              if [[ -n "$dep" && -f "Formula/${dep}.rb" ]]; then
                if ! grep -Eq '"tap":[[:space:]]*"bemly/tahoe"' "${BREW_PREFIX}/opt/${dep}/INSTALL_RECEIPT.json" 2>/dev/null; then
                  brew uninstall --force --ignore-dependencies "$dep" >/dev/null 2>&1 || true
                  rm -f "${BREW_PREFIX}/bin/${dep}" >/dev/null 2>&1 || true
                fi
              fi
            done

            # 同名公式跨 tap 不能共存（check.rb:47 的 odie）：卸掉可能预装的 core 版。
            # 加 --ignore-dependencies 是因为 brew 会以「被其它已装包依赖」为由拒绝卸载
            # （如镜像预装的 ca-certificates）；runner 是一次性环境，强卸安全。
            brew uninstall --force --ignore-dependencies "$f" 2>/dev/null || true
            # 构建工具走 PATH（llvm/z3，见 AGENTS.md §11.2）：公式里用 system "cmake"
            # 但刻意不声明 cmake 依赖——树里可能已有 core 依赖拖入裸 cmake，再挂全名会让
            # 同一 Cellar 名以两个 full_name 进锁数组，macOS flock 同进程双开自锁。
            # 这里预装本 tap cmake 瓶（幂等，已装即 no-op），构建走 PATH 即可。
            if grep -q 'system "cmake"' "Formula/${f}.rb" && \
               ! grep -Eq 'depends_on "([^"]*/)?cmake"' "Formula/${f}.rb"; then
              brew uninstall --force --ignore-dependencies "cmake" >/dev/null 2>&1 || true
              for b in cmake ccmake cpack ctest; do rm -f "${BREW_PREFIX}/bin/${b}"; done
              brew install "bemly/tahoe/cmake" 2>&1 | tail -n 3
              hash -r; command -v cmake && { cmake --version 2>&1 | head -n 1 || true; }
            fi
            # `python-setuptools` / `spice-protocol` 为 core `all` 瓶且无运行时依赖，
            # 但它们的 `:build` 依赖包含裸 `python@3.15`，声明在公式 `depends_on` 中会
            # 与本仓 `python@3.15`/`mpdecimal`/`sqlite` 在 `FormulaInstaller#lock` 相撞；
            # 仅在公式引用时用 `--ignore-dependencies` 预先倒瓶。
            if grep -q 'python-setuptools' "Formula/${f}.rb"; then
              brew list --formula python-setuptools >/dev/null 2>&1 || brew install --ignore-dependencies python-setuptools
            fi
            if grep -q 'spice-protocol' "Formula/${f}.rb"; then
              brew list --formula spice-protocol >/dev/null 2>&1 || brew install --ignore-dependencies spice-protocol
            fi
            # 先用普通模式装齐依赖再制瓶：--build-bottle 下任一依赖无瓶即硬拒
            # （UnbottledError，如 python 大版本升级要现编；llvm/z3 实测）；普通模式
            # 无此检查，缺的倒瓶、没瓶的现编。幂等（满足即 no-op）；失败要红，不加 || true。
            brew install --only-dependencies "bemly/tahoe/$f"
            brew install --build-bottle "bemly/tahoe/$f"
            brew bottle --root-url="$ROOT_URL" --json "bemly/tahoe/$f"
            # GHCR 镜像名不允许 @：node@22 → node/22（与 brew image_formula_name 一致）
            ghcr_name="${f//@//}"
            # 版本号以 brew 实际安装结果为准，不从公式文本 grep 数字——
            # 版本号段数不同（3.0 / 1.2.3.4）或注释里先出现数字都会导致误判
            version="$(brew list --versions "$f" | awk 'NR==1{print $2}')"
            echo "本次制瓶版本：${version:-未知}"

            # —— 推送前清理 GHCR 上该包的旧版本 ——
            # brew pr-upload 推送前会先 skopeo inspect，撞到已存在标签直接
            # odie "<uri> already exists!"（github_packages.rb 的 preupload_check），
            # 必须「先删再传」。（对比：docker push 同名 tag 天然覆盖，没有这道
            # 检查——CharonAnchor 能反复推正是这个原因，brew 瓶享受不到。）
            # 而逐个删版本是死路：GitHub 禁止删除包的「最后一个带标签版本」
            # （HTTP 400 "You cannot delete the last tagged version of a package.
            # You must delete the package instead."，2026-09-03 实测）。
            # → 只要有带标签的旧版本，就**删除整个包**，由 pr-upload 重建
            #   （包不存在时 pr-upload 正常建包推瓶，node@24 首推已验证）；
            #   新建的包默认私有，随后的「设为公开」步骤会再处理。
            # 其余实测踩坑（2026-09-03）：
            #   1. owner 是普通用户 → 端点必须 users/，orgs/ 恒 404；
            #   2. 包名必须带 tap 前缀并编码：tahoe%2Fnode（漏了则 404）；
            #   3. gh CLI 需要 GH_TOKEN 环境变量——Actions 不会自动把
            #      secrets.GITHUB_TOKEN 注入环境，不传则完全无凭据、stdout 为空，
            #      清理静默失效（本机测不出：gh 会回落 keyring 的个人 token）；
            #   4. 判断「有无旧瓶」只看带标签的版本；无标签版本是 image index
            #      引用的子清单，不是孤儿（见 AGENTS.md §8），不参与判断、也无需清理。
            owner="${GITHUB_REPOSITORY_OWNER}"
            pkg_encoded="tahoe%2F${ghcr_name//\//%2F}"
            tagged_vids=""
            del_scope="users/${owner}"
            for scope in "users/${owner}" "orgs/${owner}"; do
              listed="$(gh api "${scope}/packages/container/${pkg_encoded}/versions" \
                --paginate --jq '.[] | select((.metadata.container.tags | length) > 0) | .id' 2>/dev/null || true)"
              if printf '%s' "$listed" | grep -Eq '^[0-9]+$'; then
                tagged_vids="$listed"
                del_scope="$scope"
                break
              fi
            done
            if [[ -n "$tagged_vids" ]]; then
              echo "发现 ${ghcr_name} 已有带标签版本（$(echo "$tagged_vids" | tr '\n' ' ')），删除整个包以便重建。"
              gh api -X DELETE "${del_scope}/packages/container/${pkg_encoded}" \
                >/dev/null 2>&1 \
                && echo "已删除包 ${ghcr_name}，pr-upload 将重建。" \
                || echo "::warning::删除包 ${ghcr_name} 失败（可能权限不足）：pr-upload 会因 already exists 失败，需到 Packages 页面手动删除该包。"
            else
              echo "${ghcr_name} 无带标签的旧版本（首次推送或已清理），直接推送。"
            fi

            # 老版本已在上一步连同清空，这里只需推送当前版本。
            # （原先「推送后用匿名 pull token 列标签 + skopeo delete 清理」那段已移除：
            #   包私有时 curl -f 失败会以 exit 22 中断整个 job，且 skopeo 在 GHCR 上
            #   删 manifest list 会报 "unsupported"。）
            #
            # 这里绝不能用 `|| echo` 把失败降级成警告：pr-upload 失败意味着 GHCR 上
            # 仍是旧瓶，而后续步骤照样把新瓶的 sha256 写回公式，就会造成
            # 「公式 sha256 与实际可下载的瓶不符」，用户 brew install 时校验失败。
            # 宁可 job 红，不可假绿。
            brew pr-upload --root-url="$ROOT_URL" --no-commit
            echo "pr-upload 完成：${ghcr_name}:${version}"
            rm -f *.bottle.json
            commit_formula "$f" "$version"
          done

      # GHCR 包默认私有，匿名 brew install 会 401。GitHub 没有任何 API 能改包
      # 可见性（2026-09-03 实测：GraphQL 内省确认不存在 updatePackageVisibility
      # mutation；REST PATCH 带 package-deletes-preview 也返回 404），只能到
      # Packages 页面手动改。好消息：实测「删包重建」会继承原包的公开状态。
      # 原先那个调 GraphQL 的步骤因此从未生效过——这里改造成「匿名可拉体检」：
      # 对本次推送的每个包实测匿名拉取，失败则给出醒目告警提醒手动处理。
      - name: 体检 GHCR 包的匿名可拉性
        run: |
          set -euo pipefail
          owner="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          failed=""
          while IFS= read -r f; do
            [[ -n "$f" ]] || continue
            ghcr_name="${f//@//}"
            anon_token="$(curl -fsSL --max-time 30 \
              "https://ghcr.io/token?scope=repository:${owner}/tahoe/${ghcr_name}:pull" \
              | jq -r '.token // empty' || true)"
            if [[ -n "$anon_token" ]] && curl -fsSL --max-time 30 \
                 -H "Authorization: Bearer ${anon_token}" \
                 "https://ghcr.io/v2/${owner}/tahoe/${ghcr_name}/tags/list" \
                 | jq -e '(.tags // []) | length > 0' >/dev/null 2>&1; then
              echo "✓ ${ghcr_name} 可匿名拉取（公开），brew install 无需认证。"
            else
              failed="$failed ${ghcr_name}"
              echo "::warning::${ghcr_name} 无法匿名拉取（包私有或缺失）。GitHub 没有 API 能改可见性，请到 https://github.com/${GITHUB_REPOSITORY_OWNER}?tab=packages 对应包 → Package settings → Danger Zone 手动改为 Public，否则匿名 brew install 会 401。"
            fi
          done < /tmp/committed.txt
          [[ -z "$failed" ]] || echo "以下包不可匿名拉取：${failed}"
          # 只告警不阻断：公开化只能手动处理，而瓶本身已推送成功
          exit 0

      # 失败门槛：循环制瓶失败时 job 仍然红掉；已成功公式已在循环内逐个提交。
      - name: 制瓶失败门槛
        if: steps.bottle_loop.outcome == 'failure'
        run: |
          echo "::error::循环制瓶存在失败项（详见上文日志）。已成功公式已逐个提交入库；"
          echo "请先单独重跑失败的公式（bottle.yml 支持逗号列表），再重跑依赖它们的上层公式。"
          exit 1

      - name: 输出结论
        if: always()
        run: |
          {
            echo "## GHCR 制瓶结果"
            echo ""
            echo "- 软件：\`$(paste -sd, /tmp/formulas.txt)\`"
            echo "- runner：\`macos-26-intel\`（Intel + macOS 26）"
            echo "- 瓶根地址：\`$ROOT_URL\`"
            echo "- 已逐包提交：\`$(paste -sd, /tmp/committed.txt 2>/dev/null || true)\`"
          } >> "$GITHUB_STEP_SUMMARY"
