name: Build bottle and publish to GHCR

# 把上游预构建包（不重新编译）打包成 Homebrew 瓶，推送到 GHCR 覆盖旧瓶。
#
# 仅手动触发。构建环境必须是 Intel + macOS 26 才能产出 x86_64_tahoe 标签的瓶，
# GitHub 托管 runner 对应的 label 是 macos-26-intel。
#
# formula 入参支持三种写法（见 AGENTS.md 9.6 / 9.8）：
#   - 单个：  gh
#   - 多个：  gh,fastfetch   （逗号分隔，只针对这批软件出瓶，最省 runner）
#   - 全部：  all            （遍历 Formula/*.rb）
# 无论几个软件，都只在「一次」macos-26-intel 任务里顺序完成，避免多次占用 runner。
on:
  workflow_dispatch:
    inputs:
      formula:
        description: 要制瓶的软件（单个名 / 逗号分隔多个 / all 表示全部）
        required: true
        default: gh
        type: string

permissions:
  contents: write
  packages: write

# 并发组不按入参分组：不同入参的两次制瓶若并行，会同时 git push main、
# 删/推 GHCR 标签而互相冲突。全局 group 让所有制瓶任务排队串行执行。
concurrency:
  group: bottle
  cancel-in-progress: false

env:
  # GitHubPackages.root_url 会剥掉仓库名的 homebrew- 前缀：
  #   bemly/homebrew-tahoe-intel -> https://ghcr.io/v2/bemly/tahoe-intel
  ROOT_URL: https://ghcr.io/v2/${{ github.repository_owner }}/tahoe-intel
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1
  HOMEBREW_NO_ENV_HINTS: 1

jobs:
  bottle:
    runs-on: macos-26-intel
    timeout-minutes: 60

    steps:
      - name: 检出仓库
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: 计算待制瓶软件列表
        run: |
          set -euo pipefail
          # macos runner 的 /bin/bash 是 3.2，没有 mapfile，用 while-read 兼容写法
          if [[ "${{ inputs.formula }}" == "all" ]]; then
            FORMULAS=()
            while IFS= read -r line; do
              [[ -n "$line" ]] && FORMULAS+=("$line")
            done < <(ls Formula/*.rb | xargs -n1 basename | sed 's/\.rb$//')
          else
            IFS=',' read -ra FORMULAS <<< "${{ inputs.formula }}"
          fi
          # 去空、去重、排序，落到 /tmp/formulas.txt 供后续步骤复用
          printf '%s\n' "${FORMULAS[@]}" | sed '/^$/d' | sort -u > /tmp/formulas.txt
          echo "本次制瓶软件：$(paste -sd, /tmp/formulas.txt)"

      # brew tap 默认是 clone，改动会落在克隆副本上导致提交丢失。
      # 用软链接指回工作区，brew bottle --merge --write 才能改到待提交的文件。
      - name: 把本仓软链进 Taps 目录
        run: |
          set -euo pipefail
          taps_dir="$(brew --repository)/Library/Taps/${{ github.repository_owner }}"
          mkdir -p "$taps_dir"
          ln -sfn "$GITHUB_WORKSPACE" "$taps_dir/homebrew-tahoe-intel"
          brew tap-info bemly/tahoe-intel

      # 新版本 Homebrew 要求显式信任 tap，否则会忽略公式、制瓶拿不到公式。
      # 软链进来的 tap 默认不受信任，这里整体信任本 tap。
      - name: 信任本 tap
        run: brew trust bemly/tahoe-intel

      - name: 安装 skopeo（推 GHCR 的依赖）
        run: brew install skopeo

      # 一次任务内顺序处理所有软件：build-bottle 安装 → 制瓶 → 删旧标签 → 推 GHCR。
      # 只占用「一个」macos-26-intel runner，避免每个软件各占一次（见 AGENTS.md 5）。
      - name: 循环制瓶并推 GHCR
        env:
          # gh CLI 读的是 GH_TOKEN / GITHUB_TOKEN 环境变量；Actions 不会自动把
          # secrets.GITHUB_TOKEN 注入环境，不显式传则 gh 完全无凭据，
          # 调 API 时直接报认证错误、stdout 为空（清理会静默失效）。
          # 本机之所以测不出来，是因为 gh 会回落到 keyring 里的个人 token。
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_GITHUB_PACKAGES_USER: ${{ github.repository_owner }}
          HOMEBREW_GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # macos runner 的 /bin/bash 是 3.2：没有 mapfile、没有 ${var,,}，都用兼容写法
          # root_url 归一小写（仓库改名后 owner 可能带大写，与公式里的小写保持一致）
          ROOT_URL="$(printf '%s' "$ROOT_URL" | tr '[:upper:]' '[:lower:]')"
          FORMULAS=()
          while IFS= read -r line; do
            [[ -n "$line" ]] && FORMULAS+=("$line")
          done < /tmp/formulas.txt
          BREW_PREFIX="$(brew --prefix)"
          for f in "${FORMULAS[@]}"; do
            echo "===== 处理 $f ====="
            # node 家族（node / node@24 / node@22）共用 bin/node、bin/npm 等链接。
            # runner 镜像预装了 core 的 node@24（实测 24.19.0），它的链接会直接阻塞
            # 本 tap 公式的 link 步骤：
            #   "Target /usr/local/bin/node is a symlink belonging to node@24"
            # brew unlink 对预装但登记不全的 keg 会静默失败（链接仍在），
            # 所以再兜底直接删掉冲突符号链接——CI 是一次性环境，安全。
            for variant in node node@24 node@22; do
              brew uninstall --force --ignore-dependencies "$variant" >/dev/null 2>&1 || true
            done
            for b in node npm npx corepack; do
              rm -f "${BREW_PREFIX}/bin/${b}"
            done
            rm -f "${BREW_PREFIX}/share/man/man1/node.1"

            # 同名公式跨 tap 不能共存：再卸掉可能预装的 core 版（如 runner 自带 gh）
            brew uninstall --force "$f" || true
            brew install --build-bottle "bemly/tahoe-intel/$f"
            brew bottle --root-url="$ROOT_URL" --json "bemly/tahoe-intel/$f"
            # GHCR 镜像名不允许 @：node@22 → node/22（与 brew image_formula_name 一致）
            ghcr_name="${f//@//}"
            # 版本号以 brew 实际安装结果为准，不从公式文本 grep 数字——
            # 版本号段数不同（3.0 / 1.2.3.4）或注释里先出现数字都会导致误判
            version="$(brew list --versions "$f" | awk 'NR==1{print $2}')"
            echo "本次制瓶版本：${version:-未知}"

            # —— 推送前清空 GHCR 上该包的已有版本 ——
            # 两个目的：①清掉历史老瓶；②让「同版本重复运行」也能覆盖推送。
            #   brew pr-upload 发现标签已存在会直接 odie "<uri> already exists!"
            #   （Homebrew github_packages.rb 的 preupload_check），
            #   所以「保留当前版本」与「可覆盖推送」不可兼得，必须先删再传。
            # 四个实测踩坑（2026-09-03，node / node@22 推送失败的根因）：
            #   1. owner 是普通用户 → 端点必须是 users/，orgs/ 恒 404；
            #   2. package_name 必须带 tap 名并编码：tahoe-intel%2Fnode（漏了则 404）；
            #   3. gh api 把错误 JSON 打到 **stdout**（2>/dev/null 拦不住），
            #      必须校验 id 为纯数字，否则整段 JSON 会被当作 version id 去 DELETE；
            #   4. 只删「带标签」的版本：无标签的那些是 image index 引用的子清单
            #      （瓶的真正内容），不是孤儿，删了会破坏 index（见 8.5）；
            #      标签删掉后 GitHub 会自行回收不再被引用的清单。
            owner="${GITHUB_REPOSITORY_OWNER}"
            pkg_encoded="tahoe-intel%2F${ghcr_name//\//%2F}"
            old_vids=""
            api_scope="users/${owner}"
            listed=""
            for scope in "users/${owner}" "orgs/${owner}"; do
              # tags 非空的版本才是真正挂着标签的瓶，老瓶与新瓶一视同仁全删
              listed="$(gh api "${scope}/packages/container/${pkg_encoded}/versions" \
                --paginate --jq '.[] | select((.metadata.container.tags | length) > 0) | .id' 2>/dev/null || true)"
              echo "  探测 ${scope} -> $(printf '%s' "$listed" | head -c 200)"
              if printf '%s' "$listed" | grep -Eq '^[0-9]+$'; then
                old_vids="$listed"
                api_scope="$scope"
                break
              fi
            done
            # 诊断：拿不到 id 时把原始返回打出来，避免「清理静默失效」无从查起
            if [[ -z "$old_vids" ]]; then
              echo "::warning::未能列出 ${ghcr_name} 的已有版本；最后一次原始返回：$(printf '%s' "$listed" | head -c 300)"
            fi
            if [[ -n "$old_vids" ]]; then
              echo "清理 ${ghcr_name} 在 GHCR 上的已有版本，保证可覆盖推送。"
              while read -r vid; do
                [[ "$vid" =~ ^[0-9]+$ ]] || continue
                gh api -X DELETE \
                  "${api_scope}/packages/container/${pkg_encoded}/versions/${vid}" \
                  >/dev/null 2>&1 \
                  && echo "已删除版本 ${vid}。" \
                  || echo "::warning::删除版本 ${vid} 失败，跳过。"
              done <<< "$old_vids"
            else
              echo "${ghcr_name} 无已上传版本（首次推送），跳过清理。"
            fi

            # 老版本已在上一步连同清空，这里只需推送当前版本。
            # （原先「推送后用匿名 pull token 列标签 + skopeo delete 清理」那段已移除：
            #   包私有时 curl -f 失败会以 exit 22 中断整个 job，且 skopeo 在 GHCR 上
            #   删 manifest list 会报 "unsupported"。）
            #
            # 这里绝不能用 `|| echo` 把失败降级成警告：pr-upload 失败意味着 GHCR 上
            # 仍是旧瓶，而后续步骤照样把新瓶的 sha256 写回公式，就会造成
            # 「公式 sha256 与实际可下载的瓶不符」，用户 brew install 时校验失败。
            # 宁可 job 红，不可假绿。
            brew pr-upload --root-url="$ROOT_URL" --no-commit
            echo "pr-upload 完成：${ghcr_name}:${version}"
            rm -f *.bottle.json
          done

      # GHCR 包默认私有，匿名 brew install 会 401，逐个改公开；失败不阻断，
      # 可在仓库 Settings → Packages 手动改。
      - name: 尝试将 GHCR 包设为公开
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # REST 没有改可见性的端点，用 GraphQL updatePackageVisibility。
          # 不依赖 gh CLI（前面卸载了 core gh）；GITHUB_TOKEN 带 packages:write。
          QUERY_TMPL='mutation { updatePackageVisibility(input: { packageName: "tahoe-intel/%s", packageType: CONTAINER, visibility: PUBLIC }) { package { name visibility } } }'
          while IFS= read -r f; do
            [[ -n "$f" ]] || continue
            QUERY="$(printf "$QUERY_TMPL" "$f")"
            curl -fsSL -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Content-Type: application/json" \
              --data "$(jq -n --arg q "$QUERY" '{query: $q}')" \
              "https://api.github.com/graphql" || true
          done < /tmp/formulas.txt

      - name: 提交瓶块
        id: commit
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- Formula/*.rb; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "瓶块无变化，跳过提交。"
            exit 0
          fi
          git add Formula/*.rb
          git commit -m "bottle: 更新 GHCR 瓶块（$(paste -sd, /tmp/formulas.txt)）"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: 输出结论
        if: always()
        run: |
          {
            echo "## GHCR 制瓶结果"
            echo ""
            echo "- 软件：\`$(paste -sd, /tmp/formulas.txt)\`"
            echo "- runner：\`macos-26-intel\`（Intel + macOS 26）"
            echo "- 瓶根地址：\`$ROOT_URL\`"
            echo "- 瓶块已提交：\`${{ steps.commit.outputs.changed || 'false' }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
