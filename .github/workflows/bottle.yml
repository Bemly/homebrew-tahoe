name: Build bottle and publish to GHCR

# 把上游预构建包（不重新编译）打包成 Homebrew 瓶，推送到 GHCR 覆盖旧瓶。
#
# 仅手动触发。构建环境必须是 Intel + macOS 26 才能产出 x86_64_tahoe 标签的瓶，
# GitHub 托管 runner 对应的 label 是 macos-26-intel。
#
# formula 入参支持三种写法（见 AGENTS.md 9.6 / 9.8）：
#   - 单个：  gh
#   - 多个：  gh,fastfetch   （逗号分隔，只针对这批软件出瓶，最省 runner）
#   - 全部：  all            （遍历 Formula/*.rb）
# 无论几个软件，都只在「一次」macos-26-intel 任务里顺序完成，避免多次占用 runner。
on:
  workflow_dispatch:
    inputs:
      formula:
        description: 要制瓶的软件（单个名 / 逗号分隔多个 / all 表示全部）
        required: true
        default: gh
        type: string

permissions:
  contents: write
  packages: write

# 并发组不按入参分组：不同入参的两次制瓶若并行，会同时 git push main、
# 删/推 GHCR 标签而互相冲突。全局 group 让所有制瓶任务排队串行执行。
concurrency:
  group: bottle
  cancel-in-progress: false

env:
  # GitHubPackages.root_url 会剥掉仓库名的 homebrew- 前缀：
  #   bemly/homebrew-tahoe-intel -> https://ghcr.io/v2/bemly/tahoe-intel
  ROOT_URL: https://ghcr.io/v2/${{ github.repository_owner }}/tahoe-intel
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1
  HOMEBREW_NO_ENV_HINTS: 1

jobs:
  bottle:
    runs-on: macos-26-intel
    # qemu 是代编译模式：runner 是干净环境，core 侧依赖（glib/gnutls/openssl@3…
    # 无 x86_64_tahoe 瓶）要现编 1–2.5 小时，qemu 自身全量 68 目标再 2–3 小时。
    # 取平台上限 360 分钟（GitHub 单 job 硬上限 6 小时）。
    # 注：本仓是 public 仓库，标准 runner（含 macOS）不消耗付费额度。
    timeout-minutes: 360

    steps:
      - name: 检出仓库
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: 计算待制瓶软件列表
        run: |
          set -euo pipefail
          # macos runner 的 /bin/bash 是 3.2，没有 mapfile，用 while-read 兼容写法
          if [[ "${{ inputs.formula }}" == "all" ]]; then
            FORMULAS=()
            while IFS= read -r line; do
              [[ -n "$line" ]] && FORMULAS+=("$line")
            done < <(ls Formula/*.rb | xargs -n1 basename | sed 's/\.rb$//')
          else
            IFS=',' read -ra FORMULAS <<< "${{ inputs.formula }}"
          fi
          # 去空、去重、排序，落到 /tmp/formulas.txt 供后续步骤复用
          printf '%s\n' "${FORMULAS[@]}" | sed '/^$/d' | sort -u > /tmp/formulas.txt
          echo "本次制瓶软件：$(paste -sd, /tmp/formulas.txt)"

      # brew tap 默认是 clone，改动会落在克隆副本上导致提交丢失。
      # 用软链接指回工作区，brew bottle --merge --write 才能改到待提交的文件。
      - name: 把本仓软链进 Taps 目录
        run: |
          set -euo pipefail
          taps_dir="$(brew --repository)/Library/Taps/${{ github.repository_owner }}"
          mkdir -p "$taps_dir"
          ln -sfn "$GITHUB_WORKSPACE" "$taps_dir/homebrew-tahoe-intel"
          brew tap-info bemly/tahoe-intel

      # 新版本 Homebrew 要求显式信任 tap，否则会忽略公式、制瓶拿不到公式。
      # 软链进来的 tap 默认不受信任，这里整体信任本 tap。
      - name: 信任本 tap
        run: brew trust bemly/tahoe-intel

      # 秒级体检：开编之前先把 tap 内所有公式过一遍 brew readall。
      # 代编译模式一次构建可达数小时，公式若有语法/引用/门禁问题，
      # 必须在这里就红掉，而不是编译几小时后才发现（见 AGENTS.md 11.10）。
      - name: 公式体检（防白跑）
        run: brew readall bemly/tahoe-intel

      - name: 安装 skopeo（推 GHCR 的依赖）
        run: brew install skopeo

      # 一次任务内顺序处理所有软件：build-bottle 安装 → 制瓶 → 删旧标签 → 推 GHCR。
      # 只占用「一个」macos-26-intel runner，避免每个软件各占一次（见 AGENTS.md 5）。
      # pr-upload 会把瓶块写进 Formula/*.rb（--no-commit 只是不 git 提交），
      # 该改动由后面的「提交瓶块」步骤入库。若循环中途失败，前面的瓶块改动
      # 会随 runner 丢弃（2026-09-03 实测：capstone/dtc/libslirp 的瓶已推上 GHCR
      # 但瓶块丢失，导致后续 qemu 构建判其无瓶而失败）——
      # 故「提交瓶块」用 if: always() 兜底，并另设失败门槛步。
      - name: 循环制瓶并推 GHCR
        id: bottle_loop
        env:
          # gh CLI 读的是 GH_TOKEN / GITHUB_TOKEN 环境变量；Actions 不会自动把
          # secrets.GITHUB_TOKEN 注入环境，不显式传则 gh 完全无凭据，
          # 调 API 时直接报认证错误、stdout 为空（清理会静默失效）。
          # 本机之所以测不出来，是因为 gh 会回落到 keyring 里的个人 token。
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_GITHUB_PACKAGES_USER: ${{ github.repository_owner }}
          HOMEBREW_GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # macos runner 的 /bin/bash 是 3.2：没有 mapfile、没有 ${var,,}，都用兼容写法
          # root_url 归一小写（仓库改名后 owner 可能带大写，与公式里的小写保持一致）
          ROOT_URL="$(printf '%s' "$ROOT_URL" | tr '[:upper:]' '[:lower:]')"
          FORMULAS=()
          while IFS= read -r line; do
            [[ -n "$line" ]] && FORMULAS+=("$line")
          done < /tmp/formulas.txt
          BREW_PREFIX="$(brew --prefix)"
          for f in "${FORMULAS[@]}"; do
            echo "===== 处理 $f ====="
            # node 家族（node / node@24 / node@22）共用 bin/node、bin/npm 等链接。
            # runner 镜像预装了 core 的 node@24（实测 24.19.0），它的链接会直接阻塞
            # 本 tap 公式的 link 步骤：
            #   "Target /usr/local/bin/node is a symlink belonging to node@24"
            # brew unlink 对预装但登记不全的 keg 会静默失败（链接仍在），
            # 所以再兜底直接删掉冲突符号链接——CI 是一次性环境，安全。
            for variant in node node@24 node@22; do
              brew uninstall --force --ignore-dependencies "$variant" >/dev/null 2>&1 || true
            done
            for b in node npm npx corepack; do
              rm -f "${BREW_PREFIX}/bin/${b}"
            done
            rm -f "${BREW_PREFIX}/share/man/man1/node.1"

            # 同名公式跨 tap 不能共存（check.rb:47 的 odie）：卸掉可能预装的 core 版。
            # 加 --ignore-dependencies 是因为 brew 会以「被其它已装包依赖」为由拒绝卸载
            # （如镜像预装的 ca-certificates）；runner 是一次性环境，强卸安全。
            # 注意：能进本 tap 的公式都经过 hub/叶子分流（见 AGENTS.md），
            # 只有确定可被卸载、不会被生态其他包依赖的包才自己制瓶，
            # 生态枢纽包（openssl@3 / glib / gettext 等）一律走 core 不进本 tap。
            brew uninstall --force --ignore-dependencies "$f" 2>/dev/null || true
            brew install --build-bottle "bemly/tahoe-intel/$f"
            brew bottle --root-url="$ROOT_URL" --json "bemly/tahoe-intel/$f"
            # GHCR 镜像名不允许 @：node@22 → node/22（与 brew image_formula_name 一致）
            ghcr_name="${f//@//}"
            # 版本号以 brew 实际安装结果为准，不从公式文本 grep 数字——
            # 版本号段数不同（3.0 / 1.2.3.4）或注释里先出现数字都会导致误判
            version="$(brew list --versions "$f" | awk 'NR==1{print $2}')"
            echo "本次制瓶版本：${version:-未知}"

            # —— 推送前清理 GHCR 上该包的旧版本 ——
            # brew pr-upload 推送前会先 skopeo inspect，撞到已存在标签直接
            # odie "<uri> already exists!"（github_packages.rb 的 preupload_check），
            # 必须「先删再传」。（对比：docker push 同名 tag 天然覆盖，没有这道
            # 检查——CharonAnchor 能反复推正是这个原因，brew 瓶享受不到。）
            # 而逐个删版本是死路：GitHub 禁止删除包的「最后一个带标签版本」
            # （HTTP 400 "You cannot delete the last tagged version of a package.
            # You must delete the package instead."，2026-09-03 实测）。
            # → 只要有带标签的旧版本，就**删除整个包**，由 pr-upload 重建
            #   （包不存在时 pr-upload 正常建包推瓶，node@24 首推已验证）；
            #   新建的包默认私有，随后的「设为公开」步骤会再处理。
            # 其余实测踩坑（2026-09-03）：
            #   1. owner 是普通用户 → 端点必须 users/，orgs/ 恒 404；
            #   2. 包名必须带 tap 前缀并编码：tahoe-intel%2Fnode（漏了则 404）；
            #   3. gh CLI 需要 GH_TOKEN 环境变量——Actions 不会自动把
            #      secrets.GITHUB_TOKEN 注入环境，不传则完全无凭据、stdout 为空，
            #      清理静默失效（本机测不出：gh 会回落 keyring 的个人 token）；
            #   4. 判断「有无旧瓶」只看带标签的版本；无标签版本是 image index
            #      引用的子清单，不是孤儿（见 8.5），不参与判断、也无需清理。
            owner="${GITHUB_REPOSITORY_OWNER}"
            pkg_encoded="tahoe-intel%2F${ghcr_name//\//%2F}"
            tagged_vids=""
            del_scope="users/${owner}"
            for scope in "users/${owner}" "orgs/${owner}"; do
              listed="$(gh api "${scope}/packages/container/${pkg_encoded}/versions" \
                --paginate --jq '.[] | select((.metadata.container.tags | length) > 0) | .id' 2>/dev/null || true)"
              if printf '%s' "$listed" | grep -Eq '^[0-9]+$'; then
                tagged_vids="$listed"
                del_scope="$scope"
                break
              fi
            done
            if [[ -n "$tagged_vids" ]]; then
              echo "发现 ${ghcr_name} 已有带标签版本（$(echo "$tagged_vids" | tr '\n' ' ')），删除整个包以便重建。"
              gh api -X DELETE "${del_scope}/packages/container/${pkg_encoded}" \
                >/dev/null 2>&1 \
                && echo "已删除包 ${ghcr_name}，pr-upload 将重建。" \
                || echo "::warning::删除包 ${ghcr_name} 失败（可能权限不足）：pr-upload 会因 already exists 失败，需到 Packages 页面手动删除该包。"
            else
              echo "${ghcr_name} 无带标签的旧版本（首次推送或已清理），直接推送。"
            fi

            # 老版本已在上一步连同清空，这里只需推送当前版本。
            # （原先「推送后用匿名 pull token 列标签 + skopeo delete 清理」那段已移除：
            #   包私有时 curl -f 失败会以 exit 22 中断整个 job，且 skopeo 在 GHCR 上
            #   删 manifest list 会报 "unsupported"。）
            #
            # 这里绝不能用 `|| echo` 把失败降级成警告：pr-upload 失败意味着 GHCR 上
            # 仍是旧瓶，而后续步骤照样把新瓶的 sha256 写回公式，就会造成
            # 「公式 sha256 与实际可下载的瓶不符」，用户 brew install 时校验失败。
            # 宁可 job 红，不可假绿。
            brew pr-upload --root-url="$ROOT_URL" --no-commit
            echo "pr-upload 完成：${ghcr_name}:${version}"
            rm -f *.bottle.json
          done

      # GHCR 包默认私有，匿名 brew install 会 401。GitHub 没有任何 API 能改包
      # 可见性（2026-09-03 实测：GraphQL 内省确认不存在 updatePackageVisibility
      # mutation；REST PATCH 带 package-deletes-preview 也返回 404），只能到
      # Packages 页面手动改。好消息：实测「删包重建」会继承原包的公开状态。
      # 原先那个调 GraphQL 的步骤因此从未生效过——这里改造成「匿名可拉体检」：
      # 对本次推送的每个包实测匿名拉取，失败则给出醒目告警提醒手动处理。
      - name: 体检 GHCR 包的匿名可拉性
        run: |
          set -euo pipefail
          owner="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          failed=""
          while IFS= read -r f; do
            [[ -n "$f" ]] || continue
            ghcr_name="${f//@//}"
            anon_token="$(curl -fsSL --max-time 30 \
              "https://ghcr.io/token?scope=repository:${owner}/tahoe-intel/${ghcr_name}:pull" \
              | jq -r '.token // empty' || true)"
            if [[ -n "$anon_token" ]] && curl -fsSL --max-time 30 \
                 -H "Authorization: Bearer ${anon_token}" \
                 "https://ghcr.io/v2/${owner}/tahoe-intel/${ghcr_name}/tags/list" \
                 | jq -e '(.tags // []) | length > 0' >/dev/null 2>&1; then
              echo "✓ ${ghcr_name} 可匿名拉取（公开），brew install 无需认证。"
            else
              failed="$failed ${ghcr_name}"
              echo "::warning::${ghcr_name} 无法匿名拉取（包私有或缺失）。GitHub 没有 API 能改可见性，请到 https://github.com/${GITHUB_REPOSITORY_OWNER}?tab=packages 对应包 → Package settings → Danger Zone 手动改为 Public，否则匿名 brew install 会 401。"
            fi
          done < /tmp/formulas.txt
          [[ -z "$failed" ]] || echo "以下包不可匿名拉取：${failed}"
          # 只告警不阻断：公开化只能手动处理，而瓶本身已推送成功
          exit 0

      # if: always()：循环中途失败时仍把已成功的瓶块提交入库（GHCR 上的瓶
      # 与公式瓶块必须一致，否则后续安装判「无瓶」），再让门槛步红掉。
      - name: 提交瓶块
        id: commit
        if: always()
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- Formula/*.rb; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "瓶块无变化，跳过提交。"
            exit 0
          fi
          git add Formula/*.rb
          git commit -m "bottle: 更新 GHCR 瓶块（$(paste -sd, /tmp/formulas.txt)）"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # 失败门槛：循环制瓶有失败项时 job 仍然红掉（宁可真红不可假绿），
      # 但此时已成功部分的瓶块已由上面的 if: always() 步骤提交。
      - name: 制瓶失败门槛
        if: steps.bottle_loop.outcome == 'failure'
        run: |
          echo "::error::循环制瓶存在失败项（详见上文日志）。已成功部分的瓶块已提交入库；"
          echo "请先单独重跑失败的公式（bottle.yml 支持逗号列表），再重跑 qemu。"
          exit 1

      - name: 输出结论
        if: always()
        run: |
          {
            echo "## GHCR 制瓶结果"
            echo ""
            echo "- 软件：\`$(paste -sd, /tmp/formulas.txt)\`"
            echo "- runner：\`macos-26-intel\`（Intel + macOS 26）"
            echo "- 瓶根地址：\`$ROOT_URL\`"
            echo "- 瓶块已提交：\`${{ steps.commit.outputs.changed || 'false' }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
