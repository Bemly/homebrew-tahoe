name: Build bottle and publish to GHCR

# 把上游预构建包（不重新编译）打包成 Homebrew 瓶，推送到 GHCR 覆盖旧瓶。
#
# 仅手动触发。构建环境必须是 Intel + macOS 26 才能产出 x86_64_tahoe 标签的瓶，
# GitHub 托管 runner 对应的 label 是 macos-26-intel。
on:
  workflow_dispatch:
    inputs:
      formula:
        description: 要制瓶的软件
        required: true
        default: gh
        type: choice
        options:
          - gh

permissions:
  contents: write
  packages: write

concurrency:
  group: bottle-${{ inputs.formula }}
  cancel-in-progress: false

env:
  # GitHubPackages.root_url 会剥掉仓库名的 homebrew- 前缀：
  #   bemly/homebrew-tahoe-intel -> https://ghcr.io/v2/bemly/tahoe-intel
  ROOT_URL: https://ghcr.io/v2/${{ github.repository_owner }}/tahoe-intel
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1
  HOMEBREW_NO_ENV_HINTS: 1

jobs:
  bottle:
    runs-on: macos-26-intel
    timeout-minutes: 30

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # brew tap 默认是 clone，改动会落在克隆副本上导致提交丢失。
      # 用软链接指回工作区，brew bottle --merge --write 才能改到待提交的文件。
      - name: 把本仓软链进 Taps 目录
        run: |
          set -euo pipefail
          taps_dir="$(brew --repository)/Library/Taps/${{ github.repository_owner }}"
          mkdir -p "$taps_dir"
          ln -sfn "$GITHUB_WORKSPACE" "$taps_dir/homebrew-tahoe-intel"
          brew tap-info bemly/tahoe-intel

      - name: 安装 skopeo（推 GHCR 的依赖）
        run: brew install skopeo

      - name: 以 build-bottle 模式安装
        run: |
          set -euo pipefail
          # runner 镜像里 gh 来自 homebrew/core，与本 tap 同名，必须先卸掉 core 版
          brew uninstall --force gh || true
          brew install --build-bottle "bemly/tahoe-intel/${{ inputs.formula }}"

      - name: 制瓶
        run: brew bottle --root-url="$ROOT_URL" --json "bemly/tahoe-intel/${{ inputs.formula }}"

      # pr-upload 读 CWD 下的 *.bottle.json，推 GHCR，并把瓶块写回公式
      - name: 推 GHCR
        env:
          HOMEBREW_GITHUB_PACKAGES_USER: ${{ github.repository_owner }}
          HOMEBREW_GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: brew pr-upload --root-url="$ROOT_URL" --no-commit

      # GHCR 包默认私有，匿名 brew install 会 401，尽量改公开；失败不阻断，
      # 可在仓库 Settings → Packages 手动改。
      - name: 尝试将 GHCR 包设为公开
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # REST 没有改可见性的端点，用 GraphQL updatePackageVisibility。
          # 不依赖 gh CLI（前面卸载了 core gh）；GITHUB_TOKEN 带 packages:write。
          QUERY='mutation {
            updatePackageVisibility(input: {
              packageName: "tahoe-intel/${{ inputs.formula }}",
              packageType: CONTAINER,
              visibility: PUBLIC
            }) { package { name visibility } }
          }'
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "$(jq -n --arg q "$QUERY" '{query: $q}')" \
            "https://api.github.com/graphql" || true

      - name: 提交瓶块
        id: commit
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- "Formula/${{ inputs.formula }}.rb"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "瓶块无变化，跳过提交。"
            exit 0
          fi
          git add "Formula/${{ inputs.formula }}.rb"
          git commit -m "${{ inputs.formula }}: 更新 GHCR 瓶块"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: 输出结论
        if: always()
        run: |
          {
            echo "## GHCR 制瓶结果"
            echo ""
            echo "- 软件：\`${{ inputs.formula }}\`"
            echo "- runner：\`macos-26-intel\`（Intel + macOS 26）"
            echo "- 瓶根地址：\`$ROOT_URL\`"
            echo "- 瓶块已提交：\`${{ steps.commit.outputs.changed || 'false' }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
